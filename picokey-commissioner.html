<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PicoKey Web Flasher (WebUSB)</title>
<!-- GitHub Pages serves this file with its own cache headers, and phones cache
     aggressively. These three ask the browser not to keep a stale copy. They
     cannot override a CDN, which is why the visible version stamp below and the
     "force reload" button exist as well - see PAGE_VERSION. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --bg:#12161c; --panel:#1b2129; --panel2:#232b35; --line:#313c49;
    --fg:#e6edf3; --dim:#93a1b1; --accent:#3b82f6; --ok:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       padding:12px;max-width:780px;margin:0 auto}
  h1{font-size:19px;margin:4px 0 2px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--fg);
     border-left:3px solid var(--accent);padding-left:8px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:10px}
  .langbar{display:flex;gap:6px;margin-bottom:10px}
  .langbar button{flex:0 0 auto;padding:5px 12px;font-size:13px}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  button:active{opacity:.7}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  button.ghost{background:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .row>button{flex:1 1 auto;min-width:120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  input[type=text],input[type=number],select{
    width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:9px 10px;font-size:15px;font-family:inherit}
  input[type=number]{font-family:var(--mono)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  #log{background:#0b0e13;border:1px solid var(--line);border-radius:8px;
       padding:10px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;
       max-height:340px;overflow:auto;color:#c9d5e1}
  .lv-ok{color:var(--ok)} .lv-warn{color:var(--warn)} .lv-err{color:var(--danger)} .lv-dim{color:var(--dim)}
  .banner{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d}
  .banner.danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
  .banner.info{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);color:#93c5fd}
  .kv{display:flex;justify-content:space-between;gap:10px;font:13px/1.8 var(--mono);
      border-bottom:1px dashed var(--line);padding:2px 0}
  .kv span:last-child{color:#7dd3fc}
  .hidden{display:none}
  .tail{color:var(--dim);font-size:12px;text-align:center;margin:16px 0}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:13px}
  .filebtn{display:block;width:100%;text-align:center;background:var(--panel2);
           border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--dim);font-size:13px}
  #bar{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:10px}
  #barInner{height:100%;width:0;background:var(--accent);transition:width .15s}

  /* ---- modal ---- */
  #modalMask{position:fixed;inset:0;background:rgba(0,0,0,.62);
             display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
  /* Specificity: #modalMask (1,0,0) beats .hidden (0,1,0), so a bare .hidden
     would never hide this element and closeModal() would look "unclickable".
     This selector is (1,1,0) and wins. Do not remove it. */
  #modalMask.hidden{display:none}
  #modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
            max-width:520px;width:100%;max-height:80vh;overflow:auto;
            padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #modalTitle{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
  #modalBody{font-size:14px;line-height:1.65;color:#dbe4ee;white-space:pre-wrap}
  #modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #modalIcon{font-size:19px}
  .lv-icon-ok{color:var(--ok)} .lv-icon-warn{color:var(--warn)} .lv-icon-err{color:var(--danger)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;
         border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--dim)}
  .badge.on{color:var(--ok);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
  .badge.off{color:var(--dim)}
  .badge.warn{color:var(--warn);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
  .statusgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--dim);
        border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<!-- esptool-js is published unbundled: its own source imports "pako" and
     "atob-lite" as bare specifiers, which a browser cannot resolve on its own.
     Mapping them here is what makes the plain CDN build usable as a fallback
     when the bundling CDN cannot be reached. -->
<script type="importmap">
{"imports":{
  "pako":"https://unpkg.com/pako@2.1.0/dist/pako.esm.mjs",
  "atob-lite":"https://unpkg.com/atob-lite@2.0.0/atob-browser.js"
}}
</script>
</head>
<body>

<div class="langbar">
  <button class="ghost" onclick="setLang('zh')">简体中文</button>
  <button class="ghost" onclick="setLang('en')">English</button>
  <button class="ghost" onclick="forceReload()" data-i18n="btnReload" style="margin-left:auto">强制刷新</button>
</div>

<!-- Filled in by checkForUpdate() when the copy GitHub Pages is serving is
     newer than the one the browser is showing. -->
<div id="staleBar" class="banner warn hidden">
  <span data-i18n="staleText"></span>
  <button class="primary" onclick="forceReload()" data-i18n="btnReload" style="margin-top:8px;width:100%">强制刷新</button>
</div>

<h1 data-i18n="title">PicoKey 网页刷写工具</h1>
<div class="sub" data-i18n="subtitle">通过 WebUSB 给 ESP32-S2 / S3 刷入固件 · 无需安装 App · 无需编译</div>

<div class="banner danger" data-i18n="scopeWarn"></div>

<!-- ============ 1. 连接 ============ -->
<h2 data-i18n="secConnect">1. 连接处于下载模式的板子</h2>
<div class="card">
  <div class="row">
    <button class="primary" id="btnConnect" onclick="connect()" data-i18n="btnConnect">选择 USB 设备</button>
    <button id="btnDiag" onclick="diagnose()" disabled data-i18n="btnDiag">诊断接口</button>
    <button id="btnListen" onclick="listenRaw()" disabled data-i18n="btnListen">监听原始输出</button>
    <button id="btnDisconnect" onclick="disconnect()" disabled data-i18n="btnDisconnect">断开</button>
  </div>
  <div id="devInfo" class="hidden"></div>
  <div class="sub" data-i18n="hintConnect" style="margin-top:8px"></div>
  <div class="sub" data-i18n="reconnectTip"></div>
</div>

<!-- ============ 2. 选固件 ============ -->
<h2 data-i18n="secPick">2. 选择固件文件</h2>
<div class="card">
  <input type="file" id="fileInput" accept="*" style="display:none" onchange="onFile(event)">
  <label class="filebtn" for="fileInput" id="fileLabel" data-i18n="btnPickFile">点击选择固件文件</label>
  <div id="fileOut"></div>
</div>

<!-- ============ 2b. 多个文件与各自偏移 ============ -->
<h2 data-i18n="secMulti">2b. 多个文件与各自偏移</h2>
<div class="card">
  <input type="file" id="extraInput" accept="*" style="display:none" onchange="onExtraFile(event)">
  <label class="filebtn" for="extraInput" data-i18n="btnAddFile">再添加一个文件</label>
  <div id="extraList"></div>
  <div class="sub" data-i18n="hintMulti" style="margin-top:8px;white-space:pre-wrap"></div>
</div>

<!-- ============ 3. 刷写 ============ -->
<h2 data-i18n="secFlash">3. 刷入固件</h2>
<div class="card">
  <label data-i18n="lblOffset">写入偏移地址（十六进制）</label>
  <input type="text" id="offset" value="0" inputmode="text">
  <div class="sub" data-i18n="hintOffset"></div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap">
    <input type="checkbox" id="chkOfficial">
    <span data-i18n="lblOfficialEngine">使用官方 esptool-js 引擎（压缩传输 + MD5 校验）</span>
  </label>
  <div class="sub" data-i18n="hintOfficial"></div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
    <input type="checkbox" id="chkNoStub">
    <span data-i18n="lblNoStub">跳过 flasher stub（仅万不得已时勾：内置 flash 的板子读不到 flash）</span>
  </label>
  <div class="sub" data-i18n="hintNoStub"></div>
  <div class="row" style="margin-top:10px">
    <button class="danger" id="btnFlash" onclick="doFlash()" disabled data-i18n="btnFlash">刷入（会覆盖现有固件）</button>
  </div>
  <div id="bar" class="hidden"><div id="barInner"></div></div>
  <div class="sub" id="progText" style="margin-top:6px"></div>
  <div class="banner warn" data-i18n="flashWarn" style="margin-top:10px"></div>
</div>

<!-- ============ 4. 恢复 ============ -->
<h2 data-i18n="secRecovery">4. 恢复</h2>
<div class="card">
  <div class="sub" data-i18n="eraseNote" style="white-space:pre-wrap"></div>
  <div class="row" style="margin-top:10px">
    <button class="danger" id="btnErase" onclick="doErase()" disabled data-i18n="btnErase">整片擦除</button>
  </div>
  <div class="sub" id="eraseText" style="margin-top:6px"></div>
</div>

<!-- ============ 日志 ============ -->
<h2 data-i18n="secLog">日志</h2>
<div class="card">
  <div id="log"></div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" onclick="clearLog()" data-i18n="btnClearLog">清空日志</button>
    <button class="ghost" onclick="copyLog()" data-i18n="btnCopyLog">复制日志</button>
  </div>
</div>

<details class="card" id="changelogCard">
  <summary data-i18n="secChangelog">更新日志</summary>
  <div class="sub" data-i18n="changelogTitle" style="margin-top:6px"></div>
  <pre data-i18n="changelogText" style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:inherit;font-size:12px;line-height:1.65"></pre>
</details>

<div class="tail">
  <span data-i18n="tail1">esptool ROM 协议为独立实现，不含上游代码</span><br>
  <span data-i18n="tail2">需要 HTTPS + Chrome/Edge · 仅支持 ESP32-S2 / S3 下载模式</span><br>
  <span data-i18n="tailVer">页面版本</span>: <b id="verStamp">—</b>
  <span data-i18n="tailVerHint">（看到旧版本号就说明是缓存，点上面的「强制刷新」）</span>
</div>

<div id="modalMask" class="hidden">
  <div id="modalBox">
    <h3 id="modalTitle"><span id="modalIcon"></span><span id="modalTitleText"></span></h3>
    <div id="modalBody"></div>
    <div id="modalFoot">
      <button class="primary" onclick="closeModal()" data-i18n="btnModalOk">知道了</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   PicoKey Web Flasher — 单文件 WebUSB 刷写工具（ESP32-S2 / S3）

   为什么只做刷写：Chrome 从 67 起（CVE-2018-6125）屏蔽了 WebUSB 对"受保护
   接口类别"的访问，其中 0x0B（智能卡 / CCID）正是 PicoKey 固件运行时使用的
   接口。所以固件正常运行时，浏览器根本看不到设备。

   下载模式不同：ESP32 此时暴露的是 USB Serial/JTAG（厂商自定义接口），
   不在受保护列表里，浏览器可以接管 —— 刷写因此可行。
   ========================================================================= */

/* Bump this every time the file changes. It is printed at the bottom of the
   page so it is obvious at a glance whether the browser is showing the current
   copy, and checkForUpdate() compares it against what GitHub Pages serves. */
const PAGE_VERSION = 'r11';

let LANG = 'zh';
const I18N = {
  zh: {
    title:"PicoKey 网页刷写工具", subtitle:"通过 WebUSB 给 ESP32-S2 / S3 刷入固件 · 无需安装 App · 无需编译",

    secConnect:"1. 连接处于下载模式的板子", secPick:"2. 选择固件文件",
    secFlash:"3. 刷入固件",
    secLog:"日志", secChangelog:"更新日志", changelogTitle:"本页的更新记录",
    btnReload:"强制刷新",
    tailVer:"页面版本", tailVerHint:"（刷新后仍是这个号，说明 Pages 还没部署完，等几分钟）",
    staleText:"GitHub Pages 上已经是更新的版本了，当前显示的是缓存中的旧页面。",
    checkingUpdate:"正在检查页面版本…",
    updateCheckFailed:"版本检查没能完成（不影响刷写功能）",
    btnConnect:"选择 USB 设备", btnDiag:"诊断接口", btnListen:"监听原始输出", btnDisconnect:"断开",
    btnPickFile:"点击选择固件文件", btnFlash:"刷入（会覆盖现有固件）",
    secRecovery:"4. 恢复", btnErase:"整片擦除",
    eraseNote:"固件起不来时，只重刷是不够的——让它起不来的那份配置仍然留在 flash 里，刷完还是同样的状态。先整片擦除才能真正清干净。\n擦除会清空固件、配置和所有已注册的密钥。ESP32 的 ROM 下载模式烧不掉，这一步随时可以重试。",

    eraseFailBody:"擦除没有完成。\n\n请确认板子确实在 ROM 下载模式（拔掉，按住 BOOT 键不放再插上），然后重试。ROM 下载模式烧不掉，随时可以再试。\n\n详见日志。",
    btnClearLog:"清空日志", btnCopyLog:"复制日志", btnModalOk:"知道了",
    hintConnect:"让板子进入下载模式后再点上面的按钮。不同板子进入方式不同，请参考板子的说明。",

    officialFlashId:"Flash ID：{id}",
    officialNoFlash:"读不到 flash 芯片（Flash ID {id}）。\n跳过 stub 时 eFuse 里的引脚配置会被忽略，而当前芯片为内置 flash，用的不是默认引脚。\n请取消勾选「跳过 flasher stub」再来一次——这条路径走不通，不要再点刷写。",

    officialChip:"官方引擎已识别：{chip}",
    officialMd5Ok:"MD5 校验通过：{md5}",
    officialMd5Bad:"MD5 校验不一致：写入的内容和文件对不上，请重新刷写。",
    officialDone:"官方引擎刷写完成，已硬重启芯片。现在 LED 应该会亮，也能搜到两个通道。",
    officialFailed:"官方引擎报错：{msg}\n已尝试退回内置引擎，但如果仍然失败，请拔插设备重新开始。",
    flashWarn:"⚠️ 刷写路径未在真机上验证过。第一次建议先确认日志里的每一步，再真正执行。刷错通常可救回——ESP32 的 ROM 下载模式不会被刷掉。",
    tail1:"esptool ROM 协议为独立实现，不含上游代码",
    tail2:"需要 HTTPS + Chrome/Edge · 仅支持 ESP32-S2 / S3 下载模式",
    // runtime
    noWebUSB:"此浏览器不支持 WebUSB。请用 Android 上的 Chrome 或 Edge（需 HTTPS）。",
    notSecure:"页面不在安全上下文（HTTPS），WebUSB 被禁用。",

function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) || (I18N.zh[k]) || k;
  if (vars) for (const [a,b] of Object.entries(vars)) s = s.split('{'+a+'}').join(b);
  return s;
}
function setLang(l){
  LANG = l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  log('lang = ' + l, 'dim');
}

/* --------------------------- cache busting ---------------------------
   Phones cache single-file pages hard, and Pages adds its own layer. Three
   defences: the no-cache meta tags up top, a version stamp that is actually readable, and this explicit reload that appends a throwaway query so the
   browser cannot serve the cached copy. */
function forceReload(){
  const base = location.href.split('#')[0].split('?')[0];
  location.replace(base + '?v=' + Date.now());
}
async function checkForUpdate(){
  const stamp = document.getElementById('verStamp');
  if (stamp) stamp.textContent = PAGE_VERSION;
  try {
    const url = location.href.split('#')[0].split('?')[0] + '?check=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) return;
    const text = await res.text();
    const m = text.match(/const\s+PAGE_VERSION\s*=\s*'([^']+)'/);
    if (!m) return;
    const served = m[1];
    if (served !== PAGE_VERSION){
      log('stale copy: showing ' + PAGE_VERSION + ', Pages has ' + served, 'warn');
      const bar = document.getElementById('staleBar');
      if (bar){ bar.classList.remove('hidden'); }
    } else {
      log('page is current (' + served + ')', 'dim');
    }
  } catch(e){
    // Offline, or the fetch was blocked. Not worth bothering the user.
    log(t('updateCheckFailed'), 'dim');
  }
}

/* ------------------------------- logging ------------------------------- */
const logEl = document.getElementById('log');
const MAXLOG = 400;
function log(msg, level){
  const d = document.createElement('div');
  d.className = 'lv-' + (level||'dim');
  const ts = new Date().toTimeString().slice(0,8);
  d.textContent = '[' + ts + '] ' + msg;
  logEl.appendChild(d);
  while (logEl.childNodes.length > MAXLOG) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML=''; }
function copyLog(){
  navigator.clipboard.writeText(logEl.innerText)
    .then(()=>log('copied','dim')).catch(()=>log('copy failed','warn'));
}

/* --------------------------- USB state --------------------------- */
let device = null;
let epIn = null, epOut = null, ifaceNum = null;
let fwData = null;      // Uint8Array
let fwReady = false;    // recognised as an ESP image
// Extra images, each with its own offset. ESP32-S3 needs three of them
// (bootloader, partition table, app) and they MUST go over one connection:
// re-opening the device between files lets a late reply from the previous
// file be read as the answer to the next one.
let extraFiles = [];    // [{name, data, offset}]
let primaryName = '';

/* Interface classes Chrome refuses to hand to a page. From the WebUSB spec,
   added in Chrome 67 after CVE-2018-6125 (WebUSB used to bypass the FIDO U2F
   origin check through a YubiKey's CCID interface). */
const PROTECTED = new Set([0x01,0x03,0x08,0x0B,0x0E,0x10,0xE0]);
const CLASSNAME = {0x01:'audio',0x02:'CDC control',0x03:'HID',0x08:'mass storage',
  0x0A:'CDC data',0x0B:'smart card (CCID)',0x0E:'video',0x10:'audio/video',
  0xE0:'wireless',0xFF:'vendor specific'};
function hex(v,n){ return '0x'+v.toString(16).toUpperCase().padStart(n||2,'0'); }

function pickEspInterface(dev){
  const ifaces = (dev.configuration && dev.configuration.interfaces) || [];
  const found = [];
  for (const iface of ifaces){
    const alt = iface.alternates[0];
    if (!alt) continue;
    const cls = alt.interfaceClass;
    let inEp = null, outEp = null;
    for (const ep of alt.endpoints){
      if (ep.type !== 'bulk') continue;
      if (ep.direction === 'in') inEp = ep.endpointNumber;
      else outEp = ep.endpointNumber;
    }
    log(t('intfLine',{n:iface.interfaceNumber, c:hex(cls), s:hex(alt.interfaceSubclass),
                      p:hex(alt.interfaceProtocol)})
        + '  ' + (CLASSNAME[cls]||'') + (inEp!=null&&outEp!=null?'  ✓ bulk':'')
        + (PROTECTED.has(cls) ? '  ⛔' : ''), PROTECTED.has(cls) ? 'warn' : 'dim');
    if (PROTECTED.has(cls)) continue;
    if (inEp == null || outEp == null) continue;
    // esptool talks to the vendor-specific interface; fall back to CDC data,
    // then to anything else that has bulk endpoints.
    const score = cls === 0xFF ? 0 : (cls === 0x0A ? 1 : 2);
    found.push({n:iface.interfaceNumber, cls, inEp, outEp, score});
  }
  if (!found.length) return null;
  found.sort((a,b)=>a.score-b.score);
  return found[0];
}

async function connect(){
  if (!navigator.usb){ log(t('noWebUSB'),'err'); return; }
  if (!window.isSecureContext){ log(t('notSecure'),'err'); return; }

  // Tapping connect twice used to open and claim the same device again on top
  // of the previous handle. Two readers on one pipe is a fine way to produce
  // "Invalid head of packet": the second one eats bytes meant for the first.
  if (device){
    log(LANG==='zh' ? '已有连接，先释放再重连。' : 'Already connected; releasing first.', 'dim');
    await disconnect();
  }

  // Reuse an already authorised device: requestDevice() is the only call that
  // can come up empty, and re-picking something the user already granted is
  // pure friction (Android even drops the grant on every unplug).
  let picked = null;
  try {
    const known = await navigator.usb.getDevices();
    if (known && known.length){ picked = known[0]; log(t('reused'),'ok'); }
  } catch(e){ /* optional */ }

  if (!picked){
    log(t('selecting'),'dim');
    try {
      picked = await navigator.usb.requestDevice({ filters: [] });
    } catch(e){
      const name = (e && e.name) || '';
      if (name === 'NotFoundError'){
        // Empty chooser. "Cancelled" would be both wrong and useless here.
        showModal('mNoDevTitle','mNoDevBody','err');
        return;
      }
      log(t('cancelled') + ' (' + name + ')','warn'); return;
    }
  }
  device = picked;
  log(t('connected') + ': ' + (device.manufacturerName||'?') + ' / ' +
      (device.productName||'?') + '  [' + hex(device.vendorId,4) + ':' +
      hex(device.productId,4) + ']', 'ok');

  device.addEventListener('disconnect', ()=>{
    log(t('disconnected'),'warn'); resetUi();
  });

  try { await device.open(); } catch(e){ log('open failed: '+e.message,'err'); return; }
  try { if (!device.configuration) await device.selectConfiguration(1); }
  catch(e){ log('selectConfiguration: '+e.message,'warn'); }

  const pick = pickEspInterface(device);
  if (!pick){
    log(t('noUsableIntf'),'err');
    showModal('mNoDevTitle','mNoDevBody','err');
    return;
  }
  log(t('willUse',{n:pick.n, c:hex(pick.cls)}), 'ok');

  try { await device.claimInterface(pick.n); }
  catch(e){ log(t('claimFail') + ' — ' + e.message,'err'); return; }

  ifaceNum = pick.n; epIn = pick.inEp; epOut = pick.outEp;

  const nm = ((device.manufacturerName||'')+' '+(device.productName||'')).toLowerCase();
  if (nm.includes('jtag') || nm.includes('serial debug')){
    log('ℹ️ ' + (LANG==='zh'
      ? '设备名是串口/JTAG —— 这正是下载模式下应有的样子。'
      : 'Device name is serial/JTAG — exactly what download mode looks like.'), 'dim');
  }

  document.getElementById('devInfo').classList.remove('hidden');
  document.getElementById('devInfo').innerHTML =
    '<div class="kv"><span>VID:PID</span><span>'+hex(device.vendorId,4)+':'+hex(device.productId,4)+'</span></div>'+
    '<div class="kv"><span>'+t('connected')+'</span><span>'+(device.productName||'?')+'</span></div>';
  document.getElementById('btnDiag').disabled = false;
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnDisconnect').disabled = false;
  updateFlashGate();
}

function diagnose(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  log(t('diagTitle'),'dim');
  const ifaces = (device.configuration && device.configuration.interfaces) || [];
  for (const iface of ifaces){
    const alt = iface.alternates[0]; if (!alt) continue;
    log(t('intfLine',{n:iface.interfaceNumber, c:hex(alt.interfaceClass),
                      s:hex(alt.interfaceSubclass), p:hex(alt.interfaceProtocol)})
        + '  ' + (CLASSNAME[alt.interfaceClass]||''), 'dim');
    if (PROTECTED.has(alt.interfaceClass)) log(t('blockedLine'),'warn');
    for (const ep of alt.endpoints){
      log(t('epLine',{a:hex(ep.endpointNumber), d:ep.direction, t:ep.type}),'dim');
    }
  }
}

/* Reads whatever the board volunteers, without sending anything.

   This is the one test that separates the two candidate causes of
   "Uploading stub... Running stub... Invalid head of packet (0x45)":
   a chip that keeps printing its ROM banner is rebooting (Espressif
   documents that empty or invalid flash makes an ESP32-S3 reboot every
   few seconds, re-enumerating USB each time), while a quiet chip means
   the reboot happens only under load, which points at power. */
async function listenRaw(seconds){
  if (!device){ log(t('noDevice'),'warn'); return; }
  seconds = seconds || 5;
  log(t('listenTitle'),'dim');
  const deadline = Date.now() + seconds*1000;
  const got = [];
  while (Date.now() < deadline){
    let chunk = null;
    try {
      chunk = await Promise.race([
        device.transferIn(epIn, 64),
        new Promise(r => setTimeout(() => r(null), 1200))
      ]);
    } catch(e){ break; }
    if (!chunk) break;                       // nothing arrived: chip is quiet
    const b = new Uint8Array(chunk.data.buffer || chunk.data);
    if (b.length) got.push(b);
  }
  const all = new Uint8Array(got.reduce((n,b)=>n+b.length,0));
  let off = 0; for (const b of got){ all.set(b, off); off += b.length; }

  if (!all.length){
    log(t('listenQuiet',{s:seconds}), 'ok');
    log(t('listenReconnect'), 'dim');
    return;
  }
  let txt = '';
  for (const b of all) txt += (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '.';
  const banners = (txt.match(/ESP-ROM/g) || []).length;
  log(t('listenGot',{n:all.length, txt: txt.slice(0,200)}), 'dim');
  if (banners >= 2){
    log(t('listenBootLoop',{n:banners}), 'err');
  } else if (banners === 1){
    log(LANG==='zh' ? 'ℹ️ 只看到一次启动横幅 —— 这是上电时正常打印的那一次。'
                    : 'ℹ️ One boot banner only — that is the normal one printed at power-up.', 'dim');
  }
  log(t('listenReconnect'), 'dim');
}

async function disconnect(){
  if (device){
    try { if (ifaceNum!=null) await device.releaseInterface(ifaceNum); } catch(e){}
    try { await device.close(); } catch(e){}
  }
  resetUi(); log(t('disconnected'),'dim');
}
function resetUi(){
  device=null; epIn=epOut=ifaceNum=null;
  document.getElementById('devInfo').classList.add('hidden');
  document.getElementById('btnDiag').disabled = true;
  document.getElementById('btnListen').disabled = true;
  document.getElementById('btnDisconnect').disabled = true;
  updateFlashGate();
}
function updateFlashGate(){
  // Erase only needs a connected board; flashing also needs a picked image.
  const hasDev = !!device;
  const e = document.getElementById('btnErase');
  if (e) e.disabled = !hasDev;
  document.getElementById('btnFlash').disabled = !(hasDev && (fwReady || extraFiles.length));
}

/* --------------------------- SLIP + ROM protocol --------------------------- */
const SLIP_END=0xC0, SLIP_ESC=0xDB, SLIP_ESC_END=0xDC, SLIP_ESC_ESC=0xDD;
const OP_FLASH_BEGIN=0x02, OP_FLASH_DATA=0x03, OP_FLASH_END=0x04,
      OP_SYNC=0x08, OP_SPI_ATTACH=0x0D,
      OP_ERASE_FLASH=0xD0, OP_ERASE_REGION=0xD1;
const CHECKSUM_MAGIC=0xEF;

function slipEncode(bytes){
  const out=[SLIP_END];
  for (const b of bytes){
    if (b===SLIP_END) out.push(SLIP_ESC, SLIP_ESC_END);
    else if (b===SLIP_ESC) out.push(SLIP_ESC, SLIP_ESC_ESC);
    else out.push(b);
  }
  out.push(SLIP_END);
  return new Uint8Array(out);
}
/* Returns {payload, consumed} or null when the frame is incomplete.
   The escape handling restores the ORIGINAL byte: 0xDB 0xDC means 0xC0 and
   0xDB 0xDD means 0xDB. Appending the token itself silently corrupts every
   escaped byte in the frame. */
function slipDecode(buf){
  let start=-1;
  for (let i=0;i<buf.length;i++) if (buf[i]===SLIP_END){ start=i; break; }
  if (start<0) return null;
  const out=[];
  let i=start+1;
  while (i<buf.length){
    const b=buf[i];
    if (b===SLIP_END) return {payload:new Uint8Array(out), consumed:i+1};
    if (b===SLIP_ESC){
      if (i+1>=buf.length) return null;
      const nxt=buf[i+1];
      if (nxt===SLIP_ESC_END) out.push(SLIP_END);
      else if (nxt===SLIP_ESC_ESC) out.push(SLIP_ESC);
      else out.push(nxt);
      i+=2; continue;
    }
    out.push(b); i++;
  }
  return null;
}
function romChecksum(data, state){
  state = (state===undefined ? CHECKSUM_MAGIC : state) & 0x3FFFFFFF;
  const full = data.length - (data.length % 4);
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  for (let i=0;i<full;i+=4) state ^= (dv.getUint32(i,true) & 0x3FFFFFFF);
  const tail = data.length - full;
  if (tail){
    let w=0;
    for (let i=0;i<tail;i++) w |= (data[full+i] << (8*i));
    state ^= (w & 0x3FFFFFFF);
  }
  return state;
}
function packet(op, data, checksum){
  if (checksum===undefined) checksum = romChecksum(data);
  const p = new Uint8Array(8 + data.length);
  const dv = new DataView(p.buffer);
  dv.setUint8(0, 0x00);        // direction: request
  dv.setUint8(1, op);
  dv.setUint16(2, data.length, true);
  dv.setUint32(4, checksum, true);
  p.set(data, 8);
  return p;
}

class EspLoader {
  constructor(timeout){ this.timeout = timeout || 3000; this.buf = new Uint8Array(0); }

  async write(data){
    // The bulk endpoint is 64 bytes; longer transfers stall.
    for (let i=0;i<data.length;i+=64){
      const chunk = data.slice(i, i+64);
      await device.transferOut(epOut, chunk);
    }
  }
  async readChunk(ms){
    const r = await device.transferIn(epIn, 64);
    if (r.status !== 'ok') throw new Error('transfer status ' + r.status);
    return new Uint8Array(r.data.buffer || r.data);
  }
  concat(a,b){ const c=new Uint8Array(a.length+b.length); c.set(a,0); c.set(b,a.length); return c; }

  async readFrame(timeout){
    const deadline = Date.now() + (timeout || this.timeout);
    while (true){
      const f = slipDecode(this.buf);
      if (f){ this.buf = this.buf.slice(f.consumed); return f.payload; }
      if (Date.now() > deadline) throw new Error(t('espTimeout'));
      const chunk = await this.readChunk(Math.max(200, deadline - Date.now()));
      if (chunk && chunk.length) this.buf = this.concat(this.buf, chunk);
    }
  }
  async sync(attempts){
    attempts = attempts || 5;
    const payload = new Uint8Array(40);
    const dv = new DataView(payload.buffer);
    dv.setUint32(0, 0, true);
    payload.set([0x07,0x07,0x12,0x20], 4);
    payload.fill(0x55, 8);
    // Checked properly, and required twice.
    //
    // A ROM answers every time; a stray byte sequence in a firmware log that
    // happens to look like one reply will not also look like a second. The
    // app used to accept any frame starting with 0x01, which is why it could
    // print "done" on the very board where this page, reading less noise,
    // correctly said "sync failed". Same board, two answers - the difference
    // was who checked. Both sides now use the same rule.
    const oneRound = async () => {
      for (let i=0;i<attempts;i++){
        try {
          await this.write(slipEncode(packet(OP_SYNC, payload)));
          const resp = await this.readFrame(500);
          if (!resp || resp.length < 8) continue;
          if (resp[0] !== 0x01) continue;      // not a response
          if (resp[1] !== OP_SYNC) continue;   // an answer to something else
          return true;
        } catch(e){ /* retry */ }
      }
      return false;
    };
    return (await oneRound()) && (await oneRound());
  }
  async command(op, data, timeout){
    await this.write(slipEncode(packet(op, data)));
    const resp = await this.readFrame(timeout);
    if (resp.length < 8) throw new Error(t('espShort'));
    const dv = new DataView(resp.buffer, resp.byteOffset, resp.byteLength);
    const direction = resp[0], rOp = resp[1];
    const size = dv.getUint16(2, true);
    const value = dv.getUint32(4, true);
    if (direction !== 0x01 || rOp !== op) throw new Error(t('espMismatch'));
    const status = (resp.length > 8 + size) ? resp[8 + size] : 0;
    if (status) throw new Error(t('espStatus',{code:status}));
    return {value, body: resp.slice(8, 8+size)};
  }
  // reboot tells the ROM to run the firmware it has just been given. The
  // FLASH_END argument reads the opposite way: esptool sends 0 to reboot and 1
  // to stay in the bootloader. Sending 1 always used to leave the board in
  // download mode - dark LED, one USB interface - which looks like a failed
  // flash even though every byte was written.
  async flash(image, offset, onProgress, reboot=true){
    const BLOCK = 0x4000;
    const total = image.length;
    const blocks = Math.ceil(total / BLOCK);
    const u32 = v => { const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,v,true); return b; };
    const cat = arrs => { let n=0; for(const a of arrs) n+=a.length;
      const o=new Uint8Array(n); let p=0; for(const a of arrs){o.set(a,p);p+=a.length;} return o; };

    try { await this.command(OP_SPI_ATTACH, u32(0), 4000); }
    catch(e){ log(t('spiAttachNote') + ' (' + e.message + ')','warn'); }

    await this.command(OP_FLASH_BEGIN,
      cat([u32(total), u32(blocks), u32(BLOCK), u32(offset)]), 20000);

    let seq = 0;
    for (let i=0;i<blocks;i++){
      const chunk = image.slice(i*BLOCK, (i+1)*BLOCK);
      const padded = new Uint8Array(BLOCK); padded.fill(0xFF); padded.set(chunk, 0);
      await this.command(OP_FLASH_DATA, cat([u32(BLOCK), u32(seq), padded]), 8000);
      seq++;
      if (onProgress) onProgress(i+1, blocks);
    }
    await this.command(OP_FLASH_END, u32(reboot ? 0 : 1), 4000);
    return total;
  }
  async eraseFlash(timeout){
    // The ROM holds the line while it works, so this needs a long timeout -
    // 90s is generous for a 16MB chip and still bounded, so a command that
    // never answers cannot hang the page forever.
    try { await this.command(OP_SPI_ATTACH, u32(0), 4000); }
    catch(e){ log(t('spiAttachNote') + ' (' + e.message + ')','warn'); }
    await this.command(OP_ERASE_FLASH, new Uint8Array(0), timeout || 90000);
  }
  async eraseRegion(offset, size, timeout){
    try { await this.command(OP_SPI_ATTACH, u32(0), 4000); }
    catch(e){ log(t('spiAttachNote') + ' (' + e.message + ')','warn'); }
    const p = new Uint8Array(8);
    const dv = new DataView(p.buffer);
    dv.setUint32(0, size, true); dv.setUint32(4, offset, true);
    await this.command(OP_ERASE_REGION, p, timeout || 60000);
  }
}

/* --------------------------- file picking --------------------------- */
function sniff(bytes){
  if (bytes.length >= 4){
    // UF2 magic: "UF2\n" at offset 0, plus the second magic near the end.
    if (bytes[0]===0x55 && bytes[1]===0x46 && bytes[2]===0x32 && bytes[3]===0x0A)
      return 'uf2';
  }
  if (bytes.length >= 2 && bytes[0]===0x1F && bytes[1]===0x8B) return 'gzip';
  if (bytes.length >= 2 && bytes[0]===0x50 && bytes[1]===0x4B) return 'zip';
  const head = String.fromCharCode.apply(null, bytes.slice(0,16)).toLowerCase();
  if (head.includes('<!doctype') || head.includes('<html')) return 'html';
  if (bytes.length && bytes[0]===0xE9) return 'esp';
  return 'unknown';
}
async function onFile(ev){
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const buf = new Uint8Array(await f.arrayBuffer());
  fwData = buf;
  const kind = sniff(buf);
  fwReady = (kind === 'esp');
  const out = document.getElementById('fileOut');
  let cls = 'lv-warn', msg;
  if (kind==='esp'){      cls='lv-ok'; msg=t('sniffEsp'); }
  else if (kind==='uf2'){ msg=t('sniffUf2') + '\n' + t('sniffUf2Hint'); }
  else if (kind==='zip'){ msg=t('sniffZip'); }
  else if (kind==='gzip'){ msg=t('sniffGzip'); }
  else if (kind==='html'){ msg=t('sniffHtml'); }
  else { msg=t('sniffUnknown'); }
  out.innerHTML =
    '<div class="kv"><span>'+f.name+'</span><span>'+(buf.length/1024).toFixed(1)+' KB</span></div>'+
    '<div class="'+cls+'" style="margin-top:8px;font-size:13px;white-space:pre-wrap">'+msg+'</div>';
  log(t('filePicked') + ': ' + f.name + ' — ' + t('fileSize') + ' ' + buf.length + ' B',
      fwReady ? 'ok' : 'warn');
  if (!fwReady) log(msg.replace(/\n/g,' '), 'warn');
  document.getElementById('fileLabel').textContent = f.name;
  primaryName = f.name;
  updateFlashGate();
}

/* --------------------- extra images, each with an offset --------------------- */
// ESP32-S3 boots from three images at three different offsets. Guessing from
// the file name saves typing, and getting it wrong is the single most common
// reason a freshly flashed board never comes up.
function guessOffset(name){
  const n = (name || '').toLowerCase();
  if (n.includes('boot')) return '0';
  if (n.includes('partition')) return '8000';
  return '10000';
}
function collectImages(){
  const list = [];
  if (fwReady && fwData){
    const raw = (document.getElementById('offset').value || '').trim() || '0';
    const off = parseInt(raw, 16);
    list.push({
      name: primaryName || t('primaryFile'),
      data: fwData,
      offset: isNaN(off) ? 0 : off
    });
  }
  extraFiles.forEach(e => list.push({ name: e.name, data: e.data, offset: e.offset }));
  return list;
}
function renderExtra(){
  const box = document.getElementById('extraList');
  if (!extraFiles.length){ box.innerHTML = ''; updateFlashGate(); return; }
  box.innerHTML = extraFiles.map((e, i) =>
    '<div class="kv" style="margin-top:8px">' +
      '<span style="word-break:break-all">' + e.name +
        ' · ' + (e.data.length / 1024).toFixed(1) + ' KB</span>' +
      '<span><input type="text" class="offinput" data-idx="' + i + '" value="' +
        e.offset.toString(16) + '" inputmode="text" style="width:84px">' +
      ' <button onclick="removeExtra(' + i + ')">✕</button></span>' +
    '</div>').join('');
  box.querySelectorAll('.offinput').forEach(inp => {
    inp.onchange = () => {
      const i = parseInt(inp.getAttribute('data-idx'), 10);
      const v = parseInt((inp.value || '').trim(), 16);
      if (isNaN(v) || v < 0){
        log(t('badOffset'), 'err');
        inp.value = extraFiles[i].offset.toString(16);
        return;
      }
      extraFiles[i].offset = v;
      log(e0name(i) + ' -> 0x' + v.toString(16), 'dim');
    };
  });
  updateFlashGate();
}
function e0name(i){ return extraFiles[i] ? extraFiles[i].name : ('#' + i); }
async function onExtraFile(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';              // let the same file be picked again
  if (!f) return;
  const buf = new Uint8Array(await f.arrayBuffer());
  const kind = sniff(buf);
  extraFiles.push({ name: f.name, data: buf, offset: parseInt(guessOffset(f.name), 16) });
  log(t('filePicked') + ': ' + f.name + ' — ' + t('fileSize') + ' ' + buf.length + ' B' +
      (kind === 'esp' ? '' : ' [' + kind + ']'), kind === 'esp' ? 'ok' : 'warn');
  if (kind !== 'esp') log(t('sniffUnknown'), 'warn');
  renderExtra();
}
function removeExtra(i){
  const gone = extraFiles.splice(i, 1)[0];
  if (gone) log('removed ' + gone.name, 'dim');
  renderExtra();
}


/* --------------------------- MD5 (no dependency) ---------------------------
   esptool-js asks for an MD5 of the file so it can compare it against the
   digest the chip reports after writing. We could pull in a CDN hashing
   library, but the whole point of the official engine is reliability, and a
   second CDN that can fail defeats that. This is the plain MD5 transform,
   verified against the RFC 1321 vectors and cross-checked with Python's
   hashlib on a 1 MB binary. */
function md5hex(bytes){
  const S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
           5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
           4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
           6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K=new Array(64);
  for(let i=0;i<64;i++) K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
  let h0=0x67452301,h1=0xefcdab89,h2=0x98badcfe,h3=0x10325476;
  const len=bytes.length;
  const total=((((len+8)>>6)+1)<<6);
  const w=new Uint8Array(total);
  w.set(bytes,0);
  w[len]=0x80;
  const lo=(len*8)>>>0;
  const hi=Math.floor(len/0x20000000);
  for(let i=0;i<4;i++){
    w[total-8+i]=(lo>>>(8*i))&0xff;
    w[total-4+i]=(hi>>>(8*i))&0xff;
  }
  for(let off=0; off<total; off+=64){
    const M=new Uint32Array(16);
    for(let j=0;j<16;j++){
      M[j]=(w[off+j*4])|(w[off+j*4+1]<<8)|(w[off+j*4+2]<<16)|((w[off+j*4+3]<<24)>>>0);
    }
    let A=h0,B=h1,C=h2,D=h3;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){ F=(B&C)|((~B)&D); g=i; }
      else if(i<32){ F=(D&B)|((~D)&C); g=(5*i+1)%16; }
      else if(i<48){ F=B^C^D; g=(3*i+5)%16; }
      else { F=C^(B|((~D)>>>0)); g=(7*i)%16; }
      const T=(F+A+K[i]+M[g])>>>0;
      const s=S[i];
      const rot=((T<<s)|(T>>>(32-s)))>>>0;
      A=D; D=C; C=B; B=(B+rot)>>>0;
    }
    h0=(h0+A)>>>0; h1=(h1+B)>>>0; h2=(h2+C)>>>0; h3=(h3+D)>>>0;
  }
  const out=[h0,h1,h2,h3];
  let s='';
  for(let i=0;i<4;i++){
    for(let b=0;b<4;b++) s+=((out[i]>>>(8*b))&0xff).toString(16).padStart(2,'0');
  }
  return s;
}

/* --------------------- official esptool-js engine ---------------------
   Optional, and deliberately so. The built-in engine is self-contained and
   works offline; this one reaches out to a CDN. Two sources are tried: a
   bundling CDN that resolves esptool-js's own dependencies, then the plain
   npm build (which needs the import map in <head> for "pako"/"atob-lite").
   Loading is network-only — the device is not touched until both modules are
   in hand, so a failed load costs nothing and cannot leave the board
   half-claimed. */
const OFFICIAL_BAUD = 115200;   // higher rates drop out far more often on OTG

async function loadOfficial(){
  log(t('officialLoading'),'dim');
  let poly=null, esp=null;
  try {
    poly = await import('https://esm.sh/web-serial-polyfill');
    esp  = await import('https://esm.sh/esptool-js');
  } catch(e){
    log('CDN 1 failed: '+e.message,'dim');
  }
  if (!esp){
    try {
      poly = await import('https://cdn.jsdelivr.net/npm/web-serial-polyfill@1.0.15/dist/serial.js');
      esp  = await import('https://unpkg.com/esptool-js/lib/index.js');
    } catch(e){
      log('CDN 2 failed: '+e.message,'dim');
      return null;
    }
  }
  const SerialPort = poly.SerialPort || (poly.default && poly.default.SerialPort);
  if (!SerialPort || !esp.ESPLoader || !esp.Transport) return null;
  return { SerialPort, ESPLoader: esp.ESPLoader, Transport: esp.Transport };
}

function _sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* Open the port, hand it to esptool-js and get as far as a detected chip.
   Kept separate from the writing so a dropped stream can simply be retried:
   the chip only needs a reset between attempts, not a replug. */
async function openOfficialLoader(mod, skipStub){
  // Hand the device over: our own handle must be released before the
  // polyfill can claim the interfaces.
  try { await device.close(); } catch(e){ /* already closed */ }

  const port = new mod.SerialPort(device);
  await port.open({ baudRate: OFFICIAL_BAUD });

  const transport = new mod.Transport(port, true);
  const terminal = {
    clean(){},
    writeLine(d){ log(String(d)); },
    write(d){ log(String(d)); }
  };
  const loader = new mod.ESPLoader({
    transport, baudrate: OFFICIAL_BAUD, terminal, debugLogging: false
  });

  /* --no-stub.
     esptool always uploads a stub into the chip's RAM. main() calls
     this.runStub() before it returns, so replacing it on the instance leaves
     the loader on the ROM command paths, which is exactly what --no-stub does.
     Note this is normally the WRONG choice here: Espressif documents that
     --no-stub makes the tool ignore the flash pins stored in eFuse, and this
     chip's flash is in-package, so the ROM cannot reach it (Flash ID ffffff). */
  if (skipStub){
    loader.runStub = async function(){ return loader; };
    log(t('officialNoStub'),'dim');
  } else {
    log(t('officialStub'),'dim');
  }

  const chip = await loader.main();
  return { port, loader, chip };
}

async function flashWithOfficial(list, mod, skipStub){
  const ATTEMPTS = 3;
  let att = null;
  for (let i=1; i<=ATTEMPTS; i++){
    try {
      att = await openOfficialLoader(mod, skipStub);
      break;
    } catch(e){
      const msg = String((e && e.message) || e);
      log(t('officialAttempt',{n:i, msg}), i===ATTEMPTS ? 'err' : 'warn');
      if (i === ATTEMPTS) throw e;
      log(t('officialRetry',{i:i+1, n:ATTEMPTS}),'dim');
      try { await device.reset(); } catch(_){ /* may be refused */ }
      await _sleep(1500);
    }
  }
  const loader = att.loader;
  log(t('officialChip',{chip:att.chip}),'ok');

  /* Pre-flight: is the flash actually reachable?
     esptool reads the flash ID during main() but only warns about it, so a
     board it cannot talk to still gets 700 KB compressed and sent before the
     write dies. Checking here fails immediately with the real reason. */
  if (typeof loader.readFlashId === 'function'){
    let fid = null;
    try { fid = await loader.readFlashId(); } catch(e){ fid = null; }
    if (fid != null){
      const s = ('000000' + ((fid >>> 0).toString(16))).slice(-6);
      const dead = (fid === 0xFFFFFF || fid === 0x000000);
      log(t('officialFlashId',{id:s}), dead ? 'err' : 'ok');
      if (dead){
        const body = skipStub ? t('officialNoFlash',{id:s}) : t('officialNoFlashStub',{id:s});
        log(body,'err');
        showRawModal(t('mFlashFailTitle'), body, 'err');
        return false;
      }
    }
  }

  const bar = document.getElementById('bar');
  const inner = document.getElementById('barInner');
  const ptext = document.getElementById('progText');
  bar.classList.remove('hidden'); inner.style.width='0%';

  let md5ok = true;
  await loader.writeFlash({
    fileArray: list.map(im => ({ data: im.data, address: im.offset })),
    flashSize: '4MB',
    eraseAll: false,
    compress: true,
    reportProgress: (fi, written, total)=>{
      const pct = total ? Math.round(written*100/total) : 0;
      inner.style.width = pct + '%';
      ptext.textContent = (fi+1) + '/' + list.length + '  ' + pct + '%';
    },
    calculateMD5Hash: (image)=>{
      const h = md5hex(image);
      log(t('officialMd5Ok',{md5:h}),'ok');
      return h;
    }
  });

  inner.style.width='100%';
  // Without this the chip sits in the bootloader and looks exactly like a
  // failed flash: no LED, one USB interface.
  // hard_reset pulls RTS, which USB Serial/JTAG does not have at all, so
  // Espressif recommends the watchdog reset for exactly this case.
  try { await loader.after('watchdog_reset'); }
  catch(e){
    try { await loader.after('hard_reset'); } catch(e2){ /* best effort */ }
  }
  log(t('officialDone'),'ok');
  showRawModal(t('flashOkTitle'), t('officialDone'), 'ok');
  return md5ok;
}

/* --------------------------- flash --------------------------- */
async function doFlash(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  const list = collectImages();
  if (!list.length){ log(t('noFile'),'warn'); return; }
  for (const im of list){
    if (!isFinite(im.offset) || im.offset < 0){ log(t('badOffset'),'err'); return; }
  }
  // More than one image means a full ESP32-S3 restore; say what is about to
  // happen before anything is written.
  if (list.length > 1 &&
      !confirm(t('multiConfirm', {n: list.length}) + '\n\n' +
               list.map(im => '0x' + im.offset.toString(16) + '  ' + im.name).join('\n'))){
    return;
  }

  const btn = document.getElementById('btnFlash');
  const bar = document.getElementById('bar');
  const inner = document.getElementById('barInner');
  const ptext = document.getElementById('progText');
  btn.disabled = true;
  bar.classList.remove('hidden'); inner.style.width = '0%';
  log(t('flashing'),'dim');

  try {
    // Optional official engine. Fetch the modules first — loading touches
    // nothing but the network, so a failed fetch costs nothing and cannot
    // leave the board half handed over.
    const chk = document.getElementById('chkOfficial');
    if (chk && chk.checked){
      const chkStub = document.getElementById('chkNoStub');
      const skipStub = !chkStub || chkStub.checked;
      const mod = await loadOfficial();
      if (mod){
        try { await flashWithOfficial(list, mod, skipStub); return; }
        catch(e){
          log(t('officialFailed',{msg:e.message}),'warn');
          // A failed stub run leaves the chip's RAM dirty and the ROM no
          // longer answers cleanly, so the fallback usually needs a replug.
          log(t('officialDirty'),'warn');
          try { await device.open(); }
          catch(e2){ log('reopen failed: '+e2.message,'err'); return; }
        }
      } else {
        log(t('officialFail'),'warn');
      }
    }
    const loader = new EspLoader(3000);
    log(t('syncing'),'dim');
    if (!await loader.sync()) { showModal('mWrongModeTitle','mWrongModeBody','err'); throw new Error('sync failed'); }
    log('sync ok','ok');
    // One sync, then every image over the same connection. Re-syncing between
    // files lets a late reply from the previous one be read as the next answer.
    let written = 0;
    for (let k = 0; k < list.length; k++){
      const im = list[k];
      log(t('flashingFile', {
        i: k + 1, n: list.length, name: im.name, off: '0x' + im.offset.toString(16)
      }), 'dim');
      // Reboot on the last file only: rebooting earlier would drop the
      // connection while the remaining images are still queued.
      const n = await loader.flash(im.data, im.offset, (i, total)=>{
        inner.style.width = Math.round(i*100/total) + '%';
        ptext.textContent = t('flashProgress',{i, n:total});
        if (i===total || i%16===0) log(t('flashProgress',{i,n:total}),'dim');
      }, k === list.length - 1);
      written += n;
      inner.style.width = '100%';
      log(im.name + ' — ' + t('flashOk',{n}), 'ok');
    }
    log(t('flashOk',{n: written}),'ok');
    if (list.length > 1) log(t('multiDone',{n: list.length}),'ok');
    showRawModal(t('flashOkTitle'), t('flashOk',{n: written}), 'ok');
  } catch(e){
    log('flash failed: ' + e.message, 'err');
    showModal('mFlashFailTitle','mFlashFailBody','err');
  } finally {
    btn.disabled = !(device && fwReady);
  }
}

/* --------------------------- erase whole flash --------------------------- */
async function doErase(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  // Destructive and there is no undo, so ask first - and say plainly that the
  // board will not work again until firmware is flashed back onto it.
  if (!confirm(t('eraseNote') + '\n\n' + t('btnErase') + '?')) return;

  const btn = document.getElementById('btnErase');
  const etext = document.getElementById('eraseText');
  btn.disabled = true;
  etext.textContent = t('erasing');
  log(t('erasing'),'dim');

  try {
    const loader = new EspLoader(3000);
    log(t('syncing'),'dim');
    if (!await loader.sync()){
      showModal('mWrongModeTitle','mWrongModeBody','err');
      throw new Error('sync failed');
    }
    log('sync ok','ok');
    await loader.eraseFlash();
    log(t('eraseDone'),'ok');
    etext.textContent = t('eraseDone');
    showRawModal(t('btnErase'), t('eraseDone'), 'ok');
  } catch(e){
    log('erase failed: ' + e.message, 'err');
    etext.textContent = '';
    showModal('eraseFailTitle','eraseFailBody','err');
  } finally {
    btn.disabled = !device;
  }
}


/* --------------------------- boot --------------------------- */
setLang('zh');
updateFlashGate();
checkForUpdate();

// Belt and braces: the modal must start hidden even if the stylesheet fails
// to load or someone edits the markup. Without this a stuck overlay would
// swallow every tap on the page.
closeModal();

/* Fatal, page-wide problems pop up instead of hiding in the log - a red line
   in the log is exactly the kind of thing people scroll straight past. */
if (!navigator.usb){
  log(t('noWebUSB'),'err');
  showModal('mNoUsbTitle','mNoUsbBody','err');
} else if (!window.isSecureContext){
  log(t('notSecure'),'err');
  showModal('mNoHttpsTitle','mNoHttpsBody','err');
} else {
  log('WebUSB ready. ' + t('hintConnect'),'dim');
}
