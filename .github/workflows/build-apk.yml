name: Build Android APK

# Manual only, on purpose. With `on: push` enabled, every commit of this very
# file fires another run - that is how the queue ended up with a dozen
# half-finished runs that can no longer be cancelled from the UI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0. Leave empty to use v + the resolved version'
        required: false
        default: ''
      publish:
        description: 'Publish the APK to Releases'
        type: boolean
        default: true
      draft:
        description: 'Create the release as a draft (review before publishing)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      bump:
        description: 'How to set the version in buildozer.spec'
        type: choice
        default: 'auto'
        options:
          - auto    # take the newest version from CHANGELOG.md (recommended)
          - patch   # 0.2.0 -> 0.2.1
          - minor   # 0.2.0 -> 0.3.0
          - major   # 0.2.0 -> 1.0.0
          - none    # leave buildozer.spec alone
      overwrite:
        # On by default: the version only moves when CHANGELOG.md gains a new
        # section, so rebuilding without editing it resolves to a tag that is
        # already published - and refusing to clobber then fails every single
        # run. Untick this only when you want a rebuild to stop rather than
        # replace the APK that is already out there.
        description: 'Replace an existing release with this tag instead of failing (untick to protect a published version)'
        type: boolean
        default: true

# One build at a time, and a new one cancels whatever is still running.
#
# Without this, every extra tap of "Run workflow" queues another 15-40 minute
# job behind the current one - the queue fills up, each run burns Actions
# minutes producing an APK nobody will use, and the build that finally finishes
# is not necessarily the one with the latest code. Cancelling the in-progress
# run means pressing Run twice is safe: the second press replaces the first.
concurrency:
  group: build-apk
  # Not ${{ github.ref }}: this workflow is manual-only and always builds
  # main, so a fixed group is exactly right. Per-ref groups would let runs on
  # different branches pile up behind each other again.
  cancel-in-progress: true

# Needed so GITHUB_TOKEN may create a release and upload assets. Without this
# the release step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 entered deprecation on 2026-09-17: jobs on that label wait
    # in the queue much longer at peak hours (documented by GitHub as queue
    # delays, not failures). ubuntu-24.04 is the recommended replacement.
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    # You have triggered this workflow many times; older runs can sit in the
    # queue in front of the new one and make it look "stuck". This keeps only
    # the newest run per branch and cancels whatever is still queued/running.
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip python3-pip python3-setuptools \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libssl-dev libffi-dev cmake libltdl-dev

      # p4a's bootstrap ships Gradle 8.14.3, which requires JDK 17. The
      # runner's default javac is 11, which buildozer would pick up and then
      # fail on during the Gradle stage.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the debug signing key.
      #
      # A fresh runner creates a brand-new debug keystore every build, so the
      # APK is signed differently each time and Android refuses to update:
      # "App not installed as package appears to be invalid" / signature
      # mismatch, forcing an uninstall first - which wipes app data.
      #
      # Android's Gradle plugin signs debug builds with ~/.android/debug.keystore
      # (alias androiddebugkey, password android) and auto-creates it when
      # missing, so dropping a fixed one there is all it takes.
      #
      # A repository secret wins when set, so anyone who would rather not keep a
      # key in git can store the same file base64-encoded as
      # ANDROID_KEYSTORE_BASE64 and the committed copy is simply ignored.
      - name: Install signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"

          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "::notice::using the keystore from ANDROID_KEYSTORE_BASE64"
          elif [ -f tools/debug.keystore.b64 ]; then
            base64 -d tools/debug.keystore.b64 > "$KS"
            echo "::notice::using the keystore committed in tools/debug.keystore.b64"
          else
            echo "::error::no signing key available"
            exit 1
          fi

          # Fail loudly here rather than shipping an APK that cannot be updated.
          if ! keytool -list -keystore "$KS" \
               -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "::error::debug.keystore is unusable - wrong password or alias"
            exit 1
          fi

          echo "Signing key in use:"
          keytool -list -v -keystore "$KS" -storepass android 2>/dev/null \
            | grep -E 'Alias name|SHA1' | head -2

      - name: Confirm toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Show exactly how the repo was uploaded, then locate buildozer.spec
      # wherever it ended up (root, or inside a wrapper folder).
      - name: Locate project directory
        id: locate
        run: |
          echo "=== repo root ==="
          ls -la
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "::error::buildozer.spec not found anywhere in the repo"
            find . -not -path "./.git/*" | head -n 60
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "project dir = $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      # Resolve the version BEFORE buildozer runs, so the APK itself carries
      # the new number (buildozer bakes `version` into the APK metadata).
      #
      # With bump=auto the single source of truth is CHANGELOG.md: add a
      # "## [v0.3.0]" section there and this step writes 0.3.0 into
      # buildozer.spec. That removes the "edit version in two places" trap
      # where the CHANGELOG said one thing and the spec another.
      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          python3 - <<'PYEOF'
          import os, re

          BUMP = os.environ.get('BUMP', 'auto')
          SPEC = 'buildozer.spec'

          def vt(s):
              return tuple(int(x) for x in re.findall(r'\d+', s)[:3] or [0])

          def newest_in_changelog(path):
              # Highest version among the headings, so an out-of-order or
              # backfilled entry cannot pick the wrong one. Code fences are
              # stripped first - the format example at the top of the file
              # contains "## [v0.3.0]" and is not a real entry.
              try:
                  text = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  print("::warning::%s not found" % path)
                  return None
              text = re.sub(r'```.*?```', '', text, flags=re.S)
              found = [m.group(1) for m in re.finditer(r'^##\s+\[?v?([\d.]+)', text, re.M)]
              if not found:
                  return None
              return max(found, key=vt)

          spec = open(SPEC, encoding='utf-8').read()
          cur_m = re.search(r'^version\s*=\s*(\S+)', spec, re.M)
          cur = cur_m.group(1) if cur_m else '0.1.0'
          print("buildozer.spec currently says: %s" % cur)

          new = None
          if BUMP == 'none':
              new = cur
          elif BUMP in ('patch', 'minor', 'major'):
              a, b, c = (list(vt(cur)) + [0, 0, 0])[:3]
              if BUMP == 'patch':
                  new = "%d.%d.%d" % (a, b, c + 1)
              elif BUMP == 'minor':
                  new = "%d.%d.0" % (a, b + 1)
              else:
                  new = "%d.0.0" % (a + 1)
          else:
              cl = newest_in_changelog('CHANGELOG.md')
              if cl is None:
                  print("::warning::no version heading found in CHANGELOG.md; keeping %s" % cur)
                  new = cur
              elif vt(cl) <= vt(cur) and BUMP == 'auto' and cl != cur:
                  print("::warning::CHANGELOG.md newest is %s, not newer than spec %s" % (cl, cur))
                  new = cur
              else:
                  new = cl

          print("resolved version: %s (bump=%s)" % (new, BUMP))

          if new != cur:
              if cur_m:
                  spec = spec[:cur_m.start()] + 'version = ' + new + spec[cur_m.end():]
              else:
                  spec = spec.replace('[app]', '[app]\nversion = ' + new, 1)
              open(SPEC, 'w', encoding='utf-8').write(spec)
              print("::notice::buildozer.spec version bumped %s -> %s" % (cur, new))
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write("changed=true\n")
          else:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write("changed=false\n")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write("version=%s\n" % new)
              fh.write("previous=%s\n" % cur)
          PYEOF
          echo "=== buildozer.spec now says ==="
          grep -n '^version' buildozer.spec

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v2

      - name: Install buildozer / Cython
        run: |
          python3 -m pip install --user --upgrade pip
          # Cython 0.29.37 is the only choice that satisfies BOTH constraints:
          #   buildozer 1.6.0 metadata: cython<3.0
          #   p4a kivy recipe:          cython>=0.29.1,<=3.0.12
          # Pinning Cython==3.0.12 (as an earlier revision did) violates
          # buildozer's cython<3.0, and pip silently fell back to buildozer
          # 1.5.0 - which is why the old log showed "1.5.0" instead of 1.6.0.
          python3 -m pip install --user "Cython==0.29.37" "buildozer==1.6.0"
          buildozer --version
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Diagnostic only. IMPORTANT: never create ~/.buildozer/android/platform/
      # android-sdk (or anything inside it) here - buildozer decides whether to
      # download the SDK by checking if that directory exists, so pre-creating
      # it makes buildozer skip the download and then die with
      # "sdkmanager path does not exist, sdkmanager is not installed".
      - name: Report SDK state before build
        run: |
          P="$HOME/.buildozer/android/platform"
          echo "=== $P ==="
          ls -la "$P" 2>/dev/null || echo "(no platform dir yet - SDK will be downloaded)"
          echo "=== sdkmanager ==="
          ls -la "$P/android-sdk/tools/bin/" 2>/dev/null || echo "(sdkmanager not installed yet)"

      # Informational only: the APK does not depend on this passing.
      - name: Sanity check (protocol self-test, no hardware needed)
        continue-on-error: true
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          python3 -m picokeyapp.selftest || echo "self-test could not run (non-fatal)"

      # `yes |` is a catch-all for any leftover interactive prompt in the
      # toolchain (sdkmanager license, etc). buildozer.spec already sets
      # android.accept_sdk_license = True, which handles the pexpect path;
      # this covers the rest. The pipeline's exit code is buildozer's.
      - name: Build debug APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          yes | buildozer -v android debug

      - name: Diagnostics on failure
        if: failure()
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          echo "=== buildozer logs ==="
          find .buildozer "$HOME/.buildozer" -name "*.log" 2>/dev/null | head -20
          for f in $(find .buildozer -name "*.log" 2>/dev/null | tail -3); do
            echo "===== $f ====="; tail -n 150 "$f"
          done
          echo "=== SDK tree ==="
          ls -la "$HOME/.buildozer/android/platform/" 2>/dev/null
          ls -la "$HOME/.buildozer/android/platform/android-sdk/" 2>/dev/null
          ls -la "$HOME/.buildozer/android/platform/android-sdk/tools/bin/" 2>/dev/null

      # Renamed to a self-describing filename: the raw buildozer output is
      # something like picokeymanager-0.1.0-arm64_v8a-debug.apk, which says
      # nothing about what it is once it sits in a release asset list.
      - name: Prepare release assets
        id: assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          VER=$(python3 -c "
          import configparser
          c = configparser.ConfigParser()
          c.read('buildozer.spec')
          print(c['app']['version'].strip())
          " 2>/dev/null || echo "0.1.0")
          if [ -z "$VER" ]; then VER="0.1.0"; fi
          TAG="${INPUT_TAG:-v$VER}"
          case "$TAG" in v*) ;; *) TAG="v$TAG";; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          rm -rf release && mkdir -p release
          found=0
          for f in bin/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "release/picokey-manager-${TAG}-arm64-debug.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no APK produced in bin/"
            ls -la bin/ || true
            exit 1
          fi

          # Only the APK goes into the release. The web flasher is deployed to
          # GitHub Pages by static.yml instead - carrying it here as well just
          # gave people two copies that drift apart, and downloading an HTML
          # file over file:// is one of the ways people end up with a page
          # where WebUSB silently does nothing.
          ls -la release/

      # Kept as well: artifacts survive even if the release step is skipped or
      # fails, and they cost nothing extra.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picokey-manager-debug
          path: ${{ steps.locate.outputs.dir }}/bin/*.apk
          if-no-files-found: error

      # Runs unconditionally. The point is to make the single most confusing
      # failure - "nothing showed up in Releases" - self-explaining: if the
      # publish flag is off or the step is skipped, the log says so instead of
      # leaving you to guess from a stale release timestamp.
      - name: Report publish decision
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          echo "=== publish decision ==="
          echo "  tag          : ${TAG:-(none)}"
          echo "  version      : ${VER:-(none)}"
          echo "  publish flag : ${PUBLISH:-(none)}"
          if [ "${PUBLISH}" != "true" ]; then
            echo "::warning::publish=false, so NO release will be created or updated."
            echo "        The APK is still available from the 'picokey-manager-debug' artifact."
          fi
          echo "=== current releases on this repo ==="
          gh release list --limit 20 || echo "(could not list releases - check GITHUB_TOKEN permissions)"

      # ------------------------------------------------------------- release
      - name: Build release notes
        if: ${{ inputs.publish }}
        env:
          # TAG/VER come from the "Prepare release assets" step - they are not
          # shell variables until they are exported here.
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
          ARCH: arm64-v8a
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          # Bilingual on purpose: the app itself ships a zh/en switch and both
          # READMEs exist, so the release page should not be English-only.
          #
          # The heredoc is quoted ('EOF') so ${TAG} and friends stay literal for
          # the shell. Substitution is then done by Python's string.Template,
          # which only touches the three placeholders we hand it - so a stray
          # $ or ` in the prose cannot be expanded by accident. (envsubst would
          # be the obvious tool but it lives in gettext-base, which is not
          # guaranteed on every runner image.)
          # Release notes are EXTRACTED FROM CHANGELOG.md / CHANGELOG.en.md,
          # not written here. Editing the release text means editing those two
          # files - this workflow stays untouched between releases.
          cat > release/notes.tmpl <<'EOF'
          # PicoKey Manager ${TAG}

          <div align="right">

          [English](#english) | [简体中文](#简体中文)

          </div>

          ---

          ${ZH_BODY}

          ---

          ${EN_BODY}

          `${GITHUB_SHA}` - v${VER} - ${ARCH} - debug build
          EOF
          python3 - <<'PYEOF'
          import os, re
          from string import Template

          TAG = os.environ['TAG']
          VER = os.environ['VER']
          ARCH = os.environ.get('ARCH', 'arm64-v8a')

          # Pull the block for VER out of a changelog file.
          # Titles look like "## [v0.2.0] - 2026-09-26"; matching is on the
          # version token inside the heading so a "v" prefix and a date are both
          # optional. Returns "" when the file or the version is missing - the
          # release is still produced, just without that body.
          def section(path, lang):
              try:
                  text = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  print("::warning::%s not found - no %s body" % (path, lang))
                  return ""
              # Drop fenced blocks: the format example at the top contains
              # "## [v0.3.0]" and must never be mistaken for a real entry.
              text = re.sub(r'```.*?```', '', text, flags=re.S)
              lines = text.split('\n')
              # No \b here: in "v0.2.0" the "v" and the "0" are both word
              # characters, so \b0\.2\.0\b never matches. Use digit/dot
              # lookaround instead, which also stops 0.2.0 matching 0.2.01.
              pat = re.compile(r'(?<![0-9.])' + re.escape(VER) + r'(?![0-9.])')
              start = None
              for i, line in enumerate(lines):
                  m = re.match(r'^##\s+(.*)$', line)
                  if m and pat.search(m.group(1)):
                      start = i
                      break
              if start is None:
                  print("::warning::no %s section in %s - add one" % (VER, path))
                  return ""
              end = len(lines)
              for j in range(start + 1, len(lines)):
                  if re.match(r'^##\s+', lines[j]):
                      end = j
                      break
              return '\n'.join(lines[start + 1:end]).strip()

          zh = section('CHANGELOG.md', 'zh')
          en = section('CHANGELOG.en.md', 'en')
          if not zh and not en:
              print("::warning::no changelog entry at all for %s" % VER)

          raw = open('release/notes.tmpl', encoding='utf-8').read()
          out = Template(raw).safe_substitute(
              TAG=TAG, VER=VER, ARCH=ARCH,
              ZH_BODY=zh or ("(no entry for %s in CHANGELOG.md)" % VER),
              EN_BODY=en or ("(no entry for %s in CHANGELOG.en.md)" % VER),
              GITHUB_SHA=os.environ.get('GITHUB_SHA', 'unknown'),
          )
          open('release/notes.md', 'w', encoding='utf-8').write(out)
          print("=== release notes ===")
          print(out)
          PYEOF
          rm -f release/notes.tmpl
          cat release/notes.md
          # Guard: a literal ${...} left in the file means substitution missed.
          if grep -n '\${' release/notes.md; then
            echo "::error::unsubstituted placeholder left in release notes"
            exit 1
          fi

      - name: Create or update GitHub Release
        if: ${{ inputs.publish }}
        env:
          # GITHUB_TOKEN is enough here because `permissions: contents: write`
          # is declared at the top of this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then FLAGS+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi

          # APK only - see the note in the asset step above.
          ASSETS=(release/*.apk)
          echo "uploading: ${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.overwrite }}" != "true" ]; then
              # Only reached when someone deliberately unticks the box. The
              # default is now "replace", because the version stays put unless
              # CHANGELOG.md gains a new section, and failing every rebuild
              # over that helps nobody.
              echo "::error::release $TAG already exists and 'overwrite' was unticked."
              echo "::error::Raise 'version' in buildozer.spec (or add a CHANGELOG.md"
              echo "::error::section) to publish a new version, or leave 'overwrite'"
              echo "::error::ticked to replace $TAG in place."
              echo ""
              echo "Releases currently published:"
              gh release list --limit 20 || true
              exit 1
            fi
            echo "release $TAG exists - replacing the built assets (overwrite enabled)"
            echo "::warning::$TAG was already published; this build replaces its APK."
            # --clobber only overwrites same-named files; anything you added by
            # hand stays untouched.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            # keep notes in sync with this build
            gh release edit "$TAG" --notes-file release/notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          else
            echo "creating release $TAG"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "PicoKey Manager $VER" \
              --notes-file release/notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          fi

          echo "=== release URL ==="
          gh release view "$TAG" --json url --jq '.url'
          echo "=== assets now in $TAG ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'


      # Commit the version bump back so the repo and the release agree.
      # Placed last on purpose: only a build that actually produced an APK
      # (and optionally published it) should consume a version number. If the
      # build failed, the job already stopped and this never runs - so a red
      # run cannot silently burn a version.
      - name: Commit version bump
        if: ${{ steps.resolve.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.resolve.outputs.version }}
          PREV: ${{ steps.resolve.outputs.previous }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase first: another commit may have landed while the ~30 min
          # build was running, and a bare push would then be rejected.
          git pull --rebase --autostash origin "${{ github.ref_name }}" || \
            echo "::warning::rebase failed, attempting push anyway"
          git add buildozer.spec
          if git diff --cached --quiet; then
            echo "nothing to commit - buildozer.spec unchanged"
            exit 0
          fi
          # [skip ci] is belt-and-braces: this workflow is manual-only
          # (workflow_dispatch), so the push cannot re-trigger it anyway, but
          # it keeps any future push-based workflow from firing.
          git commit -m "chore: bump version ${PREV} -> ${VER} [skip ci]"
          if git push origin "HEAD:${{ github.ref_name }}"; then
            echo "::notice::buildozer.spec committed: ${PREV} -> ${VER}"
          else
            echo "::warning::could not push the version bump."
            echo "::warning::The release went out as ${VER}, so edit buildozer.spec"
            echo "::warning::to 'version = ${VER}' by hand or the next run will bump again."
          fi
