name: Deploy Pages

# Deploys the WebUSB commissioning tool to GitHub Pages.
#
# Pages is what makes the tool usable at all: WebUSB refuses to run on a plain
# http:// page, and Pages serves the site over HTTPS for free. Opening the .html
# straight from the repo (or from a file:// path) will not work.
#
# This workflow only DEPLOYS. Pages itself has to be switched on once by hand:
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# If that still says "Deploy from a branch", this run fails with
# "Get Pages site failed" - the workflow cannot turn the feature on itself.
on:
  push:
    branches: [main]
    # Only when the tool itself changed. Every push to main would otherwise
    # burn a deployment for nothing - README edits and APK version bumps do
    # not touch the page.
    paths:
      - 'picokey-commissioner.html'
      - '.github/workflows/static.yml'
  workflow_dispatch:

# Deployments must not cancel each other: a half-applied Pages deploy can leave
# the site serving stale or missing content. Queue instead, and keep the group
# separate from the APK build so the two never block one another.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write          # required to upload and deploy
  id-token: write       # required for the OIDC token deploy-pages uses

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble the site into a clean directory rather than publishing the
      # repo root: the root is full of Python sources, the signing keystore and
      # the APK build config, none of which should be on a public website.
      - name: Build site directory
        run: |
          set -eu
          mkdir -p _site
          # Reachable both as / (nice short URL) and under its real name.
          cp picokey-commissioner.html _site/index.html
          cp picokey-commissioner.html _site/picokey-commissioner.html
          # Without this Jekyll skips/rewrites files it does not recognise.
          touch _site/.nojekyll
          echo "--- site contents ---"
          ls -la _site
          test -s _site/index.html || { echo "::error::index.html is empty"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
